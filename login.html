<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="title.login">Kirish — Lider xususiy maktabi</title>
<script>
try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--navy),#0d2566)}
.box{width:min(460px,100%);background:var(--card);color:var(--text);border-radius:24px;padding:32px;border-top:6px solid var(--gold);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.box h1{font-size:2rem;color:var(--head);margin-bottom:4px}
.box .sub{color:var(--mute);margin-bottom:20px;font-size:.92rem}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-size:.9rem}
.sw{display:flex;gap:8px;margin-bottom:20px}
.sw button{flex:1;padding:10px;border-radius:999px;border:2px solid var(--head);background:var(--card);color:var(--head);font:700 .95rem var(--sans);cursor:pointer}
.sw button[aria-selected=true]{background:var(--tab-on-bg);color:var(--tab-on-fg);border-color:var(--tab-on-bg)}
label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px;color:var(--head)}
input[type=text],input[type=password]{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font:500 1rem var(--sans)}
input:focus{outline:none;border-color:var(--gold)}
.pwrap{position:relative}
.pwrap input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--mute);border-radius:50%;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--gold)}
.eye .e-off{display:none}
.eye.on .e-off{display:block}
.eye.on .e-open{display:none}
.forgot{display:block;text-align:right;font-size:.85rem;margin-top:8px;color:var(--accent);text-decoration:none}
.forgot:hover{text-decoration:underline}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles label{margin:0;display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;font-weight:500;color:var(--text)}
.roles input{accent-color:var(--gold)}
.terms{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-weight:500;font-size:.88rem;color:var(--text)}
.terms input{margin-top:4px;accent-color:var(--gold)}
.terms a{color:var(--accent)}
.go{width:100%;margin-top:20px}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--mute);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font:700 1rem var(--sans);cursor:pointer}
.gbtn:hover{border-color:var(--gold)}
#msg{min-height:1.4em;margin-top:14px;font-size:.9rem;color:#d64545}
#msg.ok{color:#2e9e5b}
.hint{font-size:.78rem;color:var(--mute);margin-top:6px}
dialog{max-width:560px;width:92%;border:0;border-radius:20px;padding:28px;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(5,12,32,.7)}
dialog h2{font-size:1.5rem;margin-bottom:12px}
dialog ol{margin:0 0 18px 20px;font-size:.92rem}dialog li{margin-bottom:8px}
</style>
</head>
<body>
<main class="box">
  <a class="back" href="index.html" data-i="l.back">← Saytga qaytish</a>
  <h1 id="ttl">Kirish</h1>
  <p class="sub" id="sub"></p>

  <div class="sw" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-m="login" data-i="l.t.login">Kirish</button>
    <button type="button" role="tab" aria-selected="false" data-m="reg" data-i="l.t.reg">Ro‘yxatdan o‘tish</button>
  </div>

  <form id="f" novalidate>
    <div id="nameW" hidden>
      <label for="name" data-i="l.name">Ism va familiya</label>
      <input type="text" id="name" autocomplete="name" data-ip="l.name.ph">
    </div>

    <label for="id" data-i="l.id">Email yoki telefon raqam</label>
    <input type="text" id="id" autocomplete="username" data-ip="l.id.ph">

    <label for="pw" data-i="l.pw">Parol</label>
    <div class="pwrap">
      <input type="password" id="pw" autocomplete="current-password" data-ip="l.pw.ph">
      <button type="button" class="eye" data-for="pw" aria-label="">
        <svg class="e-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="e-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <a href="#" class="forgot" id="forgot" data-i="l.forgot">Parolni unutdim?</a>

    <div id="regW" hidden>
      <label for="pw2" data-i="l.pw2">Parolni takrorlang</label>
      <div class="pwrap">
        <input type="password" id="pw2" autocomplete="new-password">
        <button type="button" class="eye" data-for="pw2" aria-label="">
          <svg class="e-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="e-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <label data-i="l.who">Siz kimsiz?</label>
      <div class="roles">
        <label><input type="radio" name="role" value="student"><span data-i="l.student">O‘quvchi</span></label>
        <label><input type="radio" name="role" value="teacher"><span data-i="l.teacher">O‘qituvchi</span></label>
      </div>

      <label class="terms"><input type="checkbox" id="tc"><span data-ih="l.terms"></span></label>
    </div>

    <button class="btn gold go" id="submit" type="submit">Kirish</button>
  </form>

  <div class="or" data-i="l.or">yoki</div>
  <button class="gbtn" id="google" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <span data-i="l.google">Google bilan davom etish</span>
  </button>

  <form id="fin" hidden novalidate>
    <h2 style="margin-top:22px;font-size:1.3rem" data-i="l.fin">Profilni yakunlang</h2>
    <label for="gname" data-i="l.name">Ism va familiya</label>
    <input type="text" id="gname">
    <label data-i="l.who">Siz kimsiz?</label>
    <div class="roles">
      <label><input type="radio" name="grole" value="student"><span data-i="l.student">O‘quvchi</span></label>
      <label><input type="radio" name="grole" value="teacher"><span data-i="l.teacher">O‘qituvchi</span></label>
    </div>
    <label class="terms"><input type="checkbox" id="gtc"><span data-ih="l.terms"></span></label>
    <button class="btn gold go" type="submit" data-i="l.finBtn">Saqlash va davom etish</button>
  </form>

  <div id="msg" role="status" aria-live="polite"></div>
  <p class="hint" data-i="l.hint"></p>
</main>

<dialog id="terms">
  <h2 data-i="l.tt">Foydalanish shartlari</h2>
  <ol data-list="l.tlist"></ol>
  <button class="btn gold" id="tclose" type="button" data-i="aria.close">Yopish</button>
</dialog>

<script type="module" src="login.js"></script>
</body>
</html>
